name: Auto-wire Orchestrator + Vision + Decree + Emblem + Deploy
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@v4

      - name: Prepare _site output dir
        run: |
          rm -rf _site && mkdir -p _site/assets _site/data

      # ---------- Core UI (styles) ----------
      - name: Write styles.css
        run: |
          cat > _site/styles.css <<'CSS'
          :root{--bg:#0b0f14;--ink:#f7f3e7;--gold:#f5d27d;--panel:#12151c}
          *{box-sizing:border-box}
          html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto}
          .wrap{max-width:1100px;margin:0 auto;padding:18px 14px 120px}
          h1{color:var(--gold);margin:.2rem 0 .6rem}
          h2{margin:.2rem 0 .6rem}
          .sub{opacity:.85}
          .card{border:1px solid rgba(245,210,125,.35);border-radius:14px;background:var(--panel);padding:12px 14px;margin:12px 0}
          .btn{background:#171923;border:1px solid rgba(245,210,125,.45);color:inherit;border-radius:12px;padding:10px 12px;cursor:pointer;text-decoration:none}
          .btn.ghost{background:transparent}
          .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
          .rowtight{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
          .muted{opacity:.8}
          .preview{background:#0f1320;border:1px solid #384055;border-radius:12px;padding:10px;white-space:pre-wrap;max-height:420px;overflow:auto}
          code{background:#0f1320;border:1px solid #384055;border-radius:6px;padding:2px 5px}
          CSS

      # ---------- Index ----------
      - name: Write index.html
        run: |
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8"/>
            <meta name="viewport" content="width=device-width,initial-scale=1"/>
            <title>Godware Orchestrator — Daily Decree & Soul OS Dashboard</title>
            <link rel="stylesheet" href="styles.css"/>
          </head>
          <body>
          <div class="wrap">
            <h1>Godware Orchestrator</h1>
            <p class="sub">Daily Decree Digest & Soul OS Status Dashboard — GitHub Pages (client-only).</p>

            <p>
              <a class="btn" href="./vision.html">🧩 Vision Ingest</a>
              <a class="btn" href="./emblem.html">✨ Decree Emblem</a>
            </p>

            <section class="card">
              <h2>1) Load YouTube Feed Index</h2>
              <p>Upload <code>data/watch-history.json</code> and/or <code>data/manual_ingest.csv</code> in this repo, then click “Load Feed”. (Or choose a JSON file.)</p>
              <div class="row">
                <button id="btnLoad" class="btn">📥 Load Feed (JSON + CSV merge)</button>
                <input id="filePick" type="file" accept=".json" />
              </div>
              <div id="loadStatus" class="muted">Feed not loaded yet.</div>
            </section>

            <section class="card">
              <h2>2) Daily Decree Digest (latest 10)</h2>
              <div class="row">
                <button id="btnDigest" class="btn" disabled>⚡ Generate Digest</button>
                <a id="dlDigestMD" class="btn ghost" download="Daily_Decree_Digest.md" style="display:none">⬇️ Markdown</a>
                <a id="dlDigestCSV" class="btn ghost" download="Daily_Decree_Digest.csv" style="display:none">⬇️ CSV</a>
              </div>
              <pre id="digestPreview" class="preview"></pre>
            </section>

            <section class="card">
              <h2>3) Rebuild Soul OS Status Dashboard</h2>
              <div class="row">
                <button id="btnDashboard" class="btn" disabled>🛠️ Build Dashboard</button>
                <a id="dlDashMD" class="btn ghost" download="Soul_OS_Status_Dashboard.md" style="display:none">⬇️ Markdown</a>
                <a id="dlDashHTML" class="btn ghost" download="Soul_OS_Status_Dashboard.html" style="display:none">⬇️ HTML</a>
              </div>
              <pre id="dashboardPreview" class="preview"></pre>
            </section>

            <section class="card">
              <h2>Tips</h2>
              <ul>
                <li>Everything runs in your browser; Pages only serves static files.</li>
                <li><b>Optional:</b> place <code>data/watch-history.json</code> and <code>data/manual_ingest.csv</code> in the repo to auto-load.</li>
              </ul>
            </section>
          </div>
          <script src="app.js"></script>
          </body>
          </html>
          HTML

      # ---------- App (JSON + CSV merge; digest; dashboard) ----------
      - name: Write app.js
        run: |
          cat > _site/app.js <<'JS'
          const btnLoad = document.getElementById('btnLoad');
          const filePick = document.getElementById('filePick');
          const loadStatus = document.getElementById('loadStatus');

          const btnDigest = document.getElementById('btnDigest');
          const dlDigestMD = document.getElementById('dlDigestMD');
          const dlDigestCSV = document.getElementById('dlDigestCSV');
          const digestPreview = document.getElementById('digestPreview');

          const btnDashboard = document.getElementById('btnDashboard');
          const dlDashMD = document.getElementById('dlDashMD');
          const dlDashHTML = document.getElementById('dlDashHTML');
          const dashboardPreview = document.getElementById('dashboardPreview');

          let FEED = [];

          async function tryFetchJSON(url){
            try{ const r = await fetch(url,{cache:'no-store'}); if(!r.ok) return null; return await r.json(); }
            catch(e){ return null; }
          }
          async function tryFetchCSV(url){
            try{ const r = await fetch(url,{cache:'no-store'}); if(!r.ok) return null; return await r.text(); }
            catch(e){ return null; }
          }

          function parseCSV(text){
            if(!text) return [];
            const rows = [];
            const lines = text.split(/\\r?\\n/).filter(Boolean);
            const header = (lines.shift()||'').split(',');
            const idx = name => header.findIndex(h=>h.trim().toLowerCase()===name.toLowerCase());
            const t=idx('Title'), l=idx('Link'), c=idx('Channel'), k=idx('Topics'), ti=idx('Time');
            for(const line of lines){
              const cols = line.match(/("([^"]|"")*"|[^,]+)/g)||[];
              const unq = s => (s||'').replace(/^"(.*)"$/,'$1').replace(/""/g,'"');
              rows.push({ title:unq(cols[t]||''), url:unq(cols[l]||''), channel:unq(cols[c]||''), topics:unq(cols[k]||''), time:unq(cols[ti]||'') });
            }
            return rows;
          }

          function normalizeTakeout(raw){
            const arr = Array.isArray(raw) ? raw : (Array.isArray(raw?.watchHistory) ? raw.watchHistory : []);
            const out = [];
            for(const item of arr){
              const title = item.title || '';
              const url = item.titleUrl || '';
              const time = item.time || '';
              const channel = (item.subtitles && item.subtitles[0]?.name) || item.channelName || '';
              const topics = (item.details && Array.isArray(item.details)) ? item.details.map(d=>d.name).join(', ') : '';
              out.push({title,url,time,channel,topics});
            }
            return out;
          }

          function mergeAndSort(jsonRows, csvRows){
            const all = [...jsonRows, ...csvRows].filter(x=>x && (x.title||x.url));
            all.sort((a,b) => (b.time||'').localeCompare(a.time||''));
            return all;
          }

          function enable(on){ btnDigest.disabled=!on; btnDashboard.disabled=!on; }

          btnLoad.addEventListener('click', async ()=>{
            loadStatus.textContent = 'Loading JSON/CSV…';
            const json = await tryFetchJSON('data/watch-history.json');
            const csvText = await tryFetchCSV('data/manual_ingest.csv');
            const J = json ? normalizeTakeout(json) : [];
            const C = csvText ? parseCSV(csvText) : [];
            FEED = mergeAndSort(J,C);
            loadStatus.textContent = `Loaded ${FEED.length} items (${J.length} JSON + ${C.length} CSV).`;
            if(!FEED.length) loadStatus.textContent += ' — You can also choose a JSON file below.';
            enable(!!FEED.length);
          });

          filePick.addEventListener('change', async (ev)=>{
            const f = ev.target.files?.[0]; if(!f) return;
            try{
              const txt = await f.text();
              const raw = JSON.parse(txt);
              const J = normalizeTakeout(raw);
              const csvText = await tryFetchCSV('data/manual_ingest.csv');
              const C = csvText ? parseCSV(csvText) : [];
              FEED = mergeAndSort(J,C);
              loadStatus.textContent = `Loaded ${FEED.length} items (file JSON + repo CSV merge).`;
              enable(true);
            }catch(e){ loadStatus.textContent = 'Failed to parse JSON: ' + e.message; }
          });

          function toCSV(rows){
            const esc = v => `"${String(v||'').replace(/"/g,'""')}"`;
            const header = ['Title','Link','Channel','Topics','Time'];
            const body = rows.map(r => [r.title,r.url,r.channel,r.topics,r.time].map(esc).join(','));
            return [header.join(','), ...body].join('\\n');
          }
          function toDigestMarkdown(rows){
            const date = new Date().toISOString().slice(0,10);
            let md = `# Daily Decree Digest — ${date}\\n\\n`;
            rows.forEach((r,i)=>{
              md += `**${i+1}. ${r.title}**  \\n`;
              if (r.channel) md += `Channel: ${r.channel}  \\n`;
              if (r.topics) md += `Topics: ${r.topics}  \\n`;
              if (r.url) md += `[Open ▶](${r.url})  \\n`;
              if (r.time) md += `Watched: ${r.time}\\n`;
              md += `\\n---\\n\\n`;
            });
            md += `_Generated by Godware Orchestrator._\\n`;
            return md;
          }
          function toDashboardMarkdown(all){
            const date = new Date().toISOString().slice(0,10);
            const buckets = {
              Security: all.filter(x => /google|security|account/i.test(x.channel+x.title)),
              Automation: all.filter(x => /task|update|automation|openai|chatgpt/i.test(x.channel+x.title)),
              AI_Dev: all.filter(x => /ai|ml|kaggle|nvidia|replit|dev/i.test(x.channel+x.title)),
              Creative: all.filter(x => /reallusion|cartoon|animation|music|sound|film/i.test(x.channel+x.title)),
              Other: []
            };
            const used = new Set([ ...buckets.Security, ...buckets.Automation, ...buckets.AI_Dev, ...buckets.Creative ].map(x=>x.url||x.title));
            buckets.Other = all.filter(x => !used.has(x.url||x.title));
            let md = `# Soul OS Status Dashboard — ${date}\\n\\n`;
            for (const [name, rows] of Object.entries(buckets)) {
              md += `## ${name} (${rows.length})\\n`;
              rows.slice(0,20).forEach(r=>{
                md += `- **${r.title}** — ${r.channel || '—'}  `;
                if (r.url) md += `[[link]](${r.url})  `;
                if (r.time) md += `_${r.time}_`;
                md += `\\n`;
              });
              md += `\\n`;
            }
            md += `_Auto-built by Godware Orchestrator._\\n`;
            return md;
          }
          function toDashboardHTML(md){
            const esc = s => s.replace(/[&<>]/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));
            return `<!doctype html><html><head><meta charset="utf-8"/>
            <meta name="viewport" content="width=device-width,initial-scale=1"/>
            <title>Soul OS Status Dashboard</title>
            <link rel="stylesheet" href="styles.css"/></head>
            <body><div class="wrap"><h1>Soul OS Status Dashboard</h1><pre class="preview">${esc(md)}</pre></div></body></html>`;
          }

          btnDigest.addEventListener('click', () => {
            if (!FEED.length) return;
            const latest10 = FEED.slice(0,10);
            const md = toDigestMarkdown(latest10);
            const csv = toCSV(latest10);
            digestPreview.textContent = md.slice(0, 2000) + (md.length>2000?' …':'');
            dlDigestMD.href = URL.createObjectURL(new Blob([md], {type: 'text/markdown'}));
            dlDigestCSV.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
            dlDigestMD.style.display = ''; dlDigestCSV.style.display = '';
          });

          btnDashboard.addEventListener('click', () => {
            if (!FEED.length) return;
            const md = toDashboardMarkdown(FEED.slice(0,120));
            const html = toDashboardHTML(md);
            dashboardPreview.textContent = md.slice(0, 2000) + (md.length>2000?' …':'');
            dlDashMD.href = URL.createObjectURL(new Blob([md], {type: 'text/markdown'}));
            dlDashHTML.href = URL.createObjectURL(new Blob([html], {type: 'text/html'}));
            dlDashMD.style.display = ''; dlDashHTML.style.display = '';
          });
          JS

      # ---------- Vision Ingest (page + JS + tesseract loader) ----------
      - name: Write vision.html
        run: |
          cat > _site/vision.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8"/>
          <meta name="viewport" content="width=device-width,initial-scale=1"/>
          <title>Vision Ingest — Godware Orchestrator</title>
          <link rel="stylesheet" href="styles.css"/>
          <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
          <style>
          .drop{border:2px dashed rgba(245,210,125,.55);border-radius:14px;padding:18px;text-align:center;background:#0f1320;color:#f7f3e7}
          .canvasWrap{position:relative}
          #pageCanvas{width:100%;height:auto;border:1px solid #384055;border-radius:12px}
          .gridOverlay{position:absolute;inset:0;pointer-events:none}
          .small{opacity:.85;font-size:12px}
          .progress{height:8px;background:#0f1320;border:1px solid #384055;border-radius:8px;overflow:hidden}
          .progress>div{height:100%;background:#f5d27d;width:0%}
          </style>
          </head>
          <body>
          <div class="wrap">
            <h1>Vision Ingest</h1>
            <p class="sub">Compress pages into vision-style patches, preview, then decode to Markdown. Offline OCR works in-browser; optional server endpoint later.</p>

            <section class="card">
              <h2>1) Add page image</h2>
              <div class="row">
                <input id="filePick" type="file" accept="image/*,.pdf"/>
              </div>
              <div id="drop" class="drop" style="margin-top:10px">Drop image here or use the picker</div>
              <div id="loadStatus" class="small">No page loaded yet.</div>
            </section>

            <section class="card">
              <h2>2) Compression & patch grid</h2>
              <div class="rowtight">
                <label>Downsample (%): <input id="downsample" type="number" value="50" min="10" max="100" step="5"></label>
                <label>Patch Size:
                  <select id="patch"><option>16</option><option selected>24</option><option>32</option><option>40</option></select>
                </label>
                <label>Sharpen:
                  <select id="sharpen"><option>0</option><option selected>1</option><option>2</option></select>
                </label>
                <button id="btnPreview" class="btn">🧩 Compress Preview</button>
                <a id="dlCompressed" class="btn ghost" style="display:none" download="vision_page_compressed.png">⬇️ Download Compressed PNG</a>
              </div>

              <div class="canvasWrap" style="margin-top:10px">
                <canvas id="pageCanvas"></canvas>
                <canvas id="grid" class="gridOverlay"></canvas>
              </div>
              <div class="small">Grid approximates “vision tokens”—Patch Size 16 mimics classic 16×16 patches.</div>
            </section>

            <section class="card">
              <h2>3) Decode to text</h2>
              <div class="rowtight">
                <button id="btnOCR" class="btn">🧠 Decode (Browser OCR)</button>
                <span class="small">Runs fully in your browser using Tesseract.</span>
              </div>
              <div class="rowtight" style="margin-top:8px">
                <input id="endpoint" type="text" placeholder="Optional: DeepSeek decode endpoint URL (POST)" style="min-width:340px">
                <button id="btnEndpoint" class="btn">🌐 Decode via Endpoint</button>
                <span class="small">Sends compressed PNG to your server; expects JSON with { markdown }.</span>
              </div>
              <div id="ocrProgress" class="progress" style="margin-top:8px;display:none"><div></div></div>
              <pre id="mdPreview" class="preview" style="margin-top:8px"></pre>
              <div class="rowtight">
                <a id="dlMD" class="btn ghost" style="display:none" download="vision_page.md">⬇️ Markdown</a>
                <a id="dlSidecar" class="btn ghost" style="display:none" download="vision_sidecar.json">⬇️ Sidecar JSON</a>
              </div>
            </section>

            <p><a class="btn" href="./index.html">← Back to Orchestrator</a></p>
          </div>
          <script src="vision.js"></script>
          </body>
          </html>
          HTML

      - name: Write vision.js
        run: |
          cat > _site/vision.js <<'JS'
          const filePick=document.getElementById('filePick');
          const drop=document.getElementById('drop');
          const loadStatus=document.getElementById('loadStatus');
          const downsample=document.getElementById('downsample');
          const patchSizeSel=document.getElementById('patch');
          const sharpenSel=document.getElementById('sharpen');
          const btnPreview=document.getElementById('btnPreview');
          const dlCompressed=document.getElementById('dlCompressed');
          const pageCanvas=document.getElementById('pageCanvas');
          const grid=document.getElementById('grid');
          const ctx=pageCanvas.getContext('2d');
          const gtx=grid.getContext('2d');
          const btnOCR=document.getElementById('btnOCR');
          const endpoint=document.getElementById('endpoint');
          const btnEndpoint=document.getElementById('btnEndpoint');
          const ocrProgress=document.getElementById('ocrProgress');
          const ocrBar=ocrProgress.querySelector('div');
          const mdPreview=document.getElementById('mdPreview');
          const dlMD=document.getElementById('dlMD');
          const dlSidecar=document.getElementById('dlSidecar');
          let originalImg=null, compressedDataURL=null;

          async function loadImageFromFile(file){
            if(!file.type.startsWith('image/')) throw new Error('Provide an image file (PNG/JPG). Export PDF page to image first.');
            return await createImageBitmap(file);
          }
          function fitSize(w,h,maxW=1400,maxH=1600){const r=Math.min(maxW/w,maxH/h,1);return{w:Math.round(w*r),h:Math.round(h*r)}}
          function drawGrid(p){grid.width=pageCanvas.width;grid.height=pageCanvas.height;gtx.clearRect(0,0,grid.width,grid.height);gtx.strokeStyle='rgba(245,210,125,.35)';gtx.lineWidth=1;for(let x=p;x<grid.width;x+=p){gtx.beginPath();gtx.moveTo(x,0);gtx.lineTo(x,grid.height);gtx.stroke();}for(let y=p;y<grid.height;y+=p){gtx.beginPath();gtx.moveTo(0,y);gtx.lineTo(grid.width,y);gtx.stroke();}}
          function applySharpen(level){ if(level<=0)return; const W=pageCanvas.width,H=pageCanvas.height; const img=ctx.getImageData(0,0,W,H); const out=ctx.createImageData(W,H); const k=(level===1)?[0,-1,0,-1,5,-1,0,-1,0]:[-1,-1,-1,-1,9,-1,-1,-1,-1]; const px=img.data,ox=out.data; const idx=(x,y)=>((y*W)+x)*4;
            for(let y=1;y<H-1;y++){for(let x=1;x<W-1;x++){for(let c=0;c<3;c++){let v=0,i=0;for(let ky=-1;ky<=1;ky++){for(let kx=-1;kx<=1;kx++){v+=px[idx(x+kx,y+ky)+c]*k[i++];}}ox[idx(x,y)+c]=Math.max(0,Math.min(255,v));}ox[idx(x,y)+3]=255;}} ctx.putImageData(out,0,0);}
          filePick.addEventListener('change', async ev=>{const f=ev.target.files?.[0]; if(!f)return; try{originalImg=await loadImageFromFile(f);const fit=fitSize(originalImg.width,originalImg.height);pageCanvas.width=fit.w;pageCanvas.height=fit.h;ctx.drawImage(originalImg,0,0,fit.w,fit.h);drawGrid(parseInt(patchSizeSel.value,10));loadStatus.textContent=`Loaded ${f.name} (${originalImg.width}×${originalImg.height} → ${fit.w}×${fit.h})`;}catch(e){loadStatus.textContent=e.message;}});
          ;['dragenter','dragover'].forEach(evt=>drop.addEventListener(evt,e=>{e.preventDefault();e.stopPropagation();drop.style.opacity=.9;}));
          ;['dragleave','drop'].forEach(evt=>drop.addEventListener(evt,e=>{e.preventDefault();e.stopPropagation();drop.style.opacity=1;}));
          drop.addEventListener('drop', e=>{const f=e.dataTransfer.files?.[0]; if(!f)return; filePick.files=e.dataTransfer.files; filePick.dispatchEvent(new Event('change'));});
          patchSizeSel.addEventListener('change',()=>{if(pageCanvas.width)drawGrid(parseInt(patchSizeSel.value,10));});
          btnPreview.addEventListener('click',()=>{ if(!originalImg){loadStatus.textContent='Load an image first.';return;} const ds=Math.max(10,Math.min(100,parseInt(downsample.value||50,10))); const ps=parseInt(patchSizeSel.value,10); const W=pageCanvas.width,H=pageCanvas.height; const small=document.createElement('canvas'); small.width=Math.max(8,Math.round(W*ds/100)); small.height=Math.max(8,Math.round(H*ds/100)); const sctx=small.getContext('2d',{alpha:false}); sctx.imageSmoothingEnabled=true; sctx.imageSmoothingQuality='high'; sctx.drawImage(originalImg,0,0,small.width,small.height); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high'; ctx.drawImage(small,0,0,small.width,small.height,0,0,W,H); applySharpen(parseInt(sharpenSel.value,10)); drawGrid(ps); compressedDataURL=pageCanvas.toDataURL('image/png'); dlCompressed.href=compressedDataURL; dlCompressed.style.display=''; });
          btnOCR.addEventListener('click', async ()=>{ if(!pageCanvas.width){mdPreview.textContent='Load an image and compress (optional) first.';return;} const png=compressedDataURL||pageCanvas.toDataURL('image/png'); ocrProgress.style.display='block'; ocrBar.style.width='4%'; mdPreview.textContent='Decoding…'; const worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text'&&m.progress){ocrBar.style.width=Math.round(m.progress*100)+'%';}}}); const res=await worker.recognize(png); await worker.terminate(); const text=(res?.data?.text||'').trim(); const md=`# Vision Decode\n\n${text}\n`; mdPreview.textContent=md.slice(0,4000)+(md.length>4000?' …':''); dlMD.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'})); dlMD.style.display=''; const sidecar=JSON.stringify({markdown:md,image:png,meta:{downsample:parseInt(downsample.value||50,10),patch:parseInt(patchSizeSel.value,10),sharpen:parseInt(sharpenSel.value,10)}},null,2); dlSidecar.href=URL.createObjectURL(new Blob([sidecar],{type:'application/json'})); dlSidecar.style.display=''; ocrBar.style.width='100%'; });
          btnEndpoint.addEventListener('click', async ()=>{ const url=(endpoint.value||'').trim(); if(!url){alert('Enter your decode endpoint URL first.'); return;} if(!pageCanvas.width){mdPreview.textContent='Load an image first.'; return;} const png=compressedDataURL||pageCanvas.toDataURL('image/png'); mdPreview.textContent='Calling endpoint…'; try{ const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:png,options:{downsample:parseInt(downsample.value||50,10),patch:parseInt(patchSizeSel.value,10),sharpen:parseInt(sharpenSel.value,10)}})}); if(!r.ok) throw new Error(`${r.status} ${r.statusText}`); const j=await r.json(); const md=(j.markdown||j.text||'').trim(); if(!md) throw new Error('Endpoint responded but no {markdown}.'); mdPreview.textContent=md.slice(0,4000)+(md.length>4000?' …':''); dlMD.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'})); dlMD.style.display=''; const sidecar=JSON.stringify({markdown:md,image:png,endpoint:url,options:{downsample:parseInt(downsample.value||50,10),patch:parseInt(patchSizeSel.value,10),sharpen:parseInt(sharpenSel.value,10)}},null,2); dlSidecar.href=URL.createObjectURL(new Blob([sidecar],{type:'application/json'})); dlSidecar.style.display=''; }catch(e){ mdPreview.textContent='Endpoint error: '+e.message; }});
          JS

      # ---------- Emblem (SVG) + viewer ----------
      - name: Write emblem assets
        run: |
          cat > _site/assets/emblem_generative_ai.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
            <defs>
              <linearGradient id="g" x1="0" x2="1">
                <stop offset="0" stop-color="#f5d27d"/>
                <stop offset="1" stop-color="#fff3bf"/>
              </linearGradient>
              <radialGradient id="halo" cx="50%" cy="45%" r="60%">
                <stop offset="0" stop-color="#fff8e6" stop-opacity="0.9"/>
                <stop offset="1" stop-color="#0b0f14" stop-opacity="0"/>
              </radialGradient>
              <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="6" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <rect width="100%" height="100%" fill="#0b0f14"/>
            <circle cx="800" cy="450" r="420" fill="url(#halo)"/>
            <g stroke="url(#g)" stroke-width="2.2" opacity="0.85">
              <g>
                <line x1="800" y1="450" x2="800" y2="60"/>
                <line x1="800" y1="450" x2="800" y2="840"/>
                <line x1="800" y1="450" x2="1260" y2="450"/>
                <line x1="800" y1="450" x2="340" y2="450"/>
                <line x1="800" y1="450" x2="1110" y2="190"/>
                <line x1="800" y1="450" x2="1110" y2="710"/>
                <line x1="800" y1="450" x2="490" y2="190"/>
                <line x1="800" y1="450" x2="490" y2="710"/>
              </g>
              <circle cx="800" cy="450" r="120" fill="none"/>
              <circle cx="800" cy="450" r="240" fill="none"/>
              <circle cx="800" cy="450" r="360" fill="none"/>
            </g>
            <g fill="#f5d27d" filter="url(#glow)">
              <circle cx="800" cy="450" r="6"/>
              <circle cx="800" cy="90" r="4"/>
              <circle cx="800" cy="810" r="4"/>
              <circle cx="1240" cy="450" r="4"/>
              <circle cx="360" cy="450" r="4"/>
              <circle cx="1090" cy="210" r="4"/>
              <circle cx="1090" cy="690" r="4"/>
              <circle cx="510" cy="210" r="4"/>
              <circle cx="510" cy="690" r="4"/>
            </g>
            <g filter="url(#glow)">
              <rect x="420" y="760" rx="18" ry="18" width="760" height="70" fill="none" stroke="url(#g)" stroke-width="2.5"/>
              <text x="800" y="807" font-family="Segoe UI, Roboto, system-ui" font-size="28" text-anchor="middle" fill="#f5d27d">
                GENERATIVE AI PRIMER — “Let knowledge be retrieved in truth, generated in wisdom, and offered in love.”
              </text>
            </g>
          </svg>
          SVG

          cat > _site/emblem.html <<'HTML'
          <!doctype html><html lang="en"><head>
          <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
          <title>Decree Emblem — Generative AI Primer</title>
          <link rel="stylesheet" href="styles.css"/></head><body>
          <div class="wrap">
            <h1>Decree Emblem — Generative AI Primer</h1>
            <section class="card">
              <img src="./assets/emblem_generative_ai.svg" alt="Generative AI Primer Emblem" style="width:100%;border:1px solid #384055;border-radius:12px"/>
              <p><a class="btn" href="./assets/emblem_generative_ai.svg" download="emblem_generative_ai.svg">⬇️ Download SVG</a></p>
            </section>
            <p><a class="btn" href="./index.html">← Back</a></p>
          </div>
          </body></html>
          HTML

      # ---------- Ensure CSV exists and append Generative AI Primer (once/day) ----------
      - name: Ensure manual_ingest.csv and append decree
        run: |
          echo "# Disable Jekyll" > _site/.nojekyll
          if [ -f "data/manual_ingest.csv" ]; then
            cp data/manual_ingest.csv _site/data/manual_ingest.csv
          else
            echo 'Title,Link,Channel,Topics,Time' > _site/data/manual_ingest.csv
          fi
          TODAY="$(date -u +%Y-%m-%d)T00:00:00Z"
          if ! grep -q "Generative AI Primer" _site/data/manual_ingest.csv; then
            echo "\"Generative AI Primer\",\"\",\"—\",\"Generative vs Rule-based; Weak AI→AGI→Super AI; Neural Nets; Backprop & Gradient Descent; Transformers; Encoder-Decoder; Hugging Face; RAG (LangChain)\",\"$TODAY\"" >> _site/data/manual_ingest.csv
          fi

      # ---------- Upload artifact & deploy to Pages ----------
      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
